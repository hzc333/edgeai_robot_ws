# Nav2 and AMCL parameters for one simulated robot (P1 plan 2-05 .. 2-08).
#
# Base: Nav2 1.3.10 defaults shipped in the pixi environment
# ($CONDA_PREFIX/share/nav2_bringup/params/nav2_params.yaml), reduced to the
# nodes this project runs. nav_robot.launch.py replaces these placeholders:
#   <ROBOT>        robot ID, e.g. robot_1 (namespace and frame prefix, ADR-0002)
#   <MAX_LINEAR>   resolved motion.max_linear_speed_mps  [m/s]
#   <MAX_ANGULAR>  resolved motion.max_angular_speed_radps [rad/s]
#   <BT_DIR>       installed config directory of edgeai_robot_navigation
# The same limits are enforced again by safety_watchdog (ADR-0003).
#
# Footprint: relative to <ROBOT>/base_footprint, the drive-axle midpoint. The
# robot extends 0.315 m behind and 0.115 m ahead of the axle (with ~1 cm margin),
# so an in-place turn sweeps a radius of about 0.36 m.

amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: <ROBOT>/odom
    base_frame_id: <ROBOT>/base_footprint
    scan_topic: /<ROBOT>/scan
    map_topic: /map
    first_map_only: false
    # The initial pose is only given through the relocalize service (plan 3-02).
    set_initial_pose: false
    tf_broadcast: true
    transform_tolerance: 1.0
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # Odometry noise model. The Nav2 default 0.2 overstated the noise of the
    # simulated wheel odometry: the reported spread grew to ~0.31 m during a 4.7 m
    # drive while the true error stayed near 0.1 m. Re-calibrate on the real robot.
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.2
    laser_model_type: "likelihood_field"
    laser_min_range: 0.15
    laser_max_range: 12.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    save_pose_rate: 0.5
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    update_min_a: 0.2
    update_min_d: 0.25

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: <ROBOT>/base_footprint
    odom_topic: /<ROBOT>/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    # Fewer recovery retries so unreachable goals fail in seconds (see the XML).
    default_nav_to_pose_bt_xml: <BT_DIR>/navigate_to_pose_edgeai.xml
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    # Neither 0.10 m of travel nor 0.3 rad of rotation within 10 s aborts the goal (the
    # agent reports BLOCKED). Rotation counts as progress: an in-place 180 deg turn,
    # halved by the collision monitor's slow zone near walls, takes over 20 s and was
    # aborted by the SimpleProgressChecker.
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.10
      required_movement_angle: 0.3
      movement_time_allowance: 10.0
    # robot_agent checks each goal's own tolerance (plan 2-12). Nav2 stops as soon as
    # it is inside this tolerance and a repeated goal does not move the robot, so it
    # must be tighter than any requested tolerance (rescue arrival: 0.08 m).
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: <MAX_LINEAR>
      lookahead_dist: 0.4
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: <MAX_ANGULAR>
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.0
      allow_reversing: false
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: <ROBOT>/odom
      robot_base_frame: <ROBOT>/base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.115, 0.175], [0.115, -0.175], [-0.315, -0.175], [-0.315, 0.175]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /<ROBOT>/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: <ROBOT>/base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.115, 0.175], [0.115, -0.175], [-0.315, -0.175], [-0.315, 0.175]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # Absolute: the shared map, not /<ROBOT>/map.
        map_topic: /map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /<ROBOT>/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.25
      use_astar: false
      # Task 1 exploration plans through unknown space (P2 frontiers).
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: <ROBOT>/odom
    global_frame: map
    robot_base_frame: <ROBOT>/base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: <MAX_ANGULAR>
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [<MAX_LINEAR>, 0.0, <MAX_ANGULAR>]
    min_velocity: [-0.05, 0.0, -<MAX_ANGULAR>]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: /<ROBOT>/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: <ROBOT>/base_footprint
    odom_frame_id: <ROBOT>/odom
    cmd_vel_in_topic: cmd_vel_smoothed
    # Not cmd_vel: safety_watchdog is the only cmd_vel publisher (ADR-0003).
    cmd_vel_out_topic: cmd_vel_safe_in
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["StopZone", "SlowZone"]
    # Footprint grown by 0.05 m: stop.
    StopZone:
      type: "polygon"
      points: "[[0.165, 0.225], [0.165, -0.225], [-0.365, -0.225], [-0.365, 0.225]]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: "stop_zone"
      enabled: true
    # Footprint grown by 0.20 m: halve the speed.
    SlowZone:
      type: "polygon"
      points: "[[0.315, 0.375], [0.315, -0.375], [-0.515, -0.375], [-0.515, 0.375]]"
      action_type: "slowdown"
      min_points: 4
      slowdown_ratio: 0.5
      visualize: true
      polygon_pub_topic: "slow_zone"
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /<ROBOT>/scan
      # The LiDAR is 0.155 m above the floor; the default 0.15 would drop most points.
      min_height: 0.05
      max_height: 2.0
      enabled: true
